<svg viewBox="0 0 900 220" width="900" height="220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="rg" cx="88%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dp" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#58A6FF" opacity="0.07"/>
    </pattern>
  </defs>

  <style>
    .name {
      font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 50px;
      font-weight: 700;
      fill: #e6edf3;
      animation: up 0.65s 0.2s ease both;
    }
    .sub {
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      fill: #7d8590;
      letter-spacing: 0.18em;
      animation: up 0.65s 0.45s ease both;
    }
    .cursor {
      fill: #58A6FF;
      animation: blink 1.1s 1.3s step-end infinite;
    }
    .bar { animation: fadein 0.45s 0.05s ease both; }
    .slash { animation: fadein 0.5s 0.7s ease both; }
    .uline {
      stroke-dasharray: 330;
      stroke-dashoffset: 330;
      animation: draw 0.75s 0.65s ease-out both;
    }
    @keyframes up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadein {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }
  </style>

  <rect width="900" height="220" fill="#0d1117"/>
  <rect width="900" height="220" fill="url(#dp)"/>
  <rect width="900" height="220" fill="url(#rg)"/>

  <rect class="bar" x="58" y="50" width="3" height="120" rx="1.5" fill="#58A6FF"/>

  <text class="name" x="80" y="120">Akshay Damle<tspan class="cursor" dx="3">_</tspan></text>
  <line class="uline" x1="80" y1="129" x2="408" y2="129" stroke="#58A6FF" stroke-width="1.5" opacity="0.35"/>
  <text class="sub" x="80" y="158">CS STUDENT  ·  AI SECURITY  ·  BOT HUNTER</text>

  <text class="slash" x="790" y="178"
    font-family="'Courier New', monospace"
    font-size="82px"
    font-weight="700"
    fill="#58A6FF"
    opacity="0.04">/&gt;</text>
</svg>
